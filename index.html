<style>

</style></head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],T='  ';
const ta=$('#ta'),pre=$('#pre'),gut=$('#gut'),mk=$('#mk'),pf=$('#pf'),q=$('#q'),fb=$('#fb');
let P,cur='html',db,cs=false,ht,st,pt,lastN=0;

const E=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const lsg=k=>{try{return localStorage.getItem(k)}catch(e){}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
/* ---------- IndexedDB ---------- */
const opn=()=>new Promise((r,j)=>{const x=indexedDB.open('sanzone',1);x.onupgradeneeded=()=>x.result.createObjectStore('p',{keyPath:'id'});x.onsuccess=()=>r(x.result);x.onerror=()=>j(x.error)});
const tx=(m,f)=>new Promise((r,j)=>{const t=db.transaction('p',m),o=f(t.objectStore('p'));t.oncomplete=()=>r(o&&o.result);t.onerror=()=>j(t.error)});
const mem=new Map(),all=()=>db?tx('readonly',s=>s.getAll()):Promise.resolve([...mem.values()]),put=p=>db?tx('readwrite',s=>s.put(p)):(mem.set(p.id,p),Promise.resolve()),del=id=>db?tx('readwrite',s=>s.delete(id)):(mem.delete(id),Promise.resolve());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const STARTER={html:'<h1>Hello, SanZone!</h1>\n<p>Edit the code on the left.</p>\n<button id="b">Click me</button>',css:'body {\n  font-family: system-ui, sans-serif;\n  text-align: center;\n  padding: 40px;\n  background: #111;\n  color: #fff;\n}\nbutton {\n  padding: 10px 20px;\n  border-radius: 8px;\n  border: 0;\n  cursor: pointer;\n}',js:'let n = 0;\ndocument.getElementById("b").onclick = () => {\n  n++;\n  document.getElementById("b").textContent = "Clicked " + n;\n};'};
const newP=name=>({id:uid(),name,...STARTER,t:Date.now()});
/* ---------- Syntax highlighting ---------- */
const KW=/^(?:var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|import|export|from|default|try|catch|finally|throw|async|await|typeof|instanceof|in|of|this|null|undefined|true|false|void|delete|yield|super|static)$/;
function tok(t,re,fn){let o='',l=0,m;re.lastIndex=0;while((m=re.exec(t))){o+=E(t.slice(l,m.index))+fn(m);l=re.lastIndex;if(!m[0])re.lastIndex++}return o+E(t.slice(l))}
function hl(t,k){
 if(k==='js')return tok(t,/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\[\s\S]|[^`\\])*`)|(\b\d[\w.]*\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)/g,m=>m[1]?S('c',m[0]):m[2]?S('s',m[0]):m[3]?S('n',m[0]):m[4]?S(KW.test(m[4])?'k':'f',m[0]):m[5]&&KW.test(m[5])?S('k',m[0]):E(m[0]));
 if(k==='css')return tok(t,/(\/\*[\s\S]*?\*\/)|("[^"\n]*"|'[^'\n]*')|(@[\w-]+)|([\w-]+)(?=\s*:)|(#[0-9a-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|em|rem|%|vh|vw|s|ms|deg)?)/g,m=>m[1]?S('c',m[0]):m[2]?S('s',m[0]):m[3]?S('k',m[0]):m[4]?S('p',m[0]):S('n',m[0]));
 return tok(t,/(<!--[\s\S]*?-->)|(<\/?[A-Za-z!][^>]*>)/g,m=>m[1]?S('c',m[0]):tok(m[2],/("[^"]*"|'[^']*')|(^<\/?[\w!-]+|\/?>$)|([\w:-]+)(?==)/g,x=>x[1]?S('s',x[0]):x[2]?S('k',x[0]):S('f',x[0])));
}
/* ---------- Editor core ---------- */
function render(){const v=ta.value;pre.innerHTML=hl(v,cur)+'\n ';const n=v.split('\n').length;if(n!==lastN){gut.innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>');lastN=n}marks();sync()}
function sync(){pre.scrollTop=mk.scrollTop=gut.scrollTop=ta.scrollTop;pre.scrollLeft=mk.scrollLeft=ta.scrollLeft}
function snap(){const h=hist[cur],v=ta.value;if(h.s[h.i]&&h.s[h.i].v===v)return;h.s=h.s.slice(0,h.i+1);h.s.push({v,a:ta.selectionStart,b:ta.selectionEnd});if(h.s.length>300)h.s.shift();h.i=h.s.length-1}
function setV(v,a,b){snap();ta.value=v;ta.setSelectionRange(a,b);snap();render();changed()}
function undo(d){snap();const h=hist[cur],i=h.i+d;if(i<0||i>=h.s.length)return;h.i=i;const s=h.s[i];ta.value=s.v;ta.setSelectionRange(s.a,s.b);render();changed()}
function changed(){P[cur]=ta.value;P.t=Date.now();$('#st').textContent='Saving…';clearTimeout(st);st=setTimeout(async()=>{try{await put(P);$('#st').textContent='Saved ✓'}catch(e){$('#st').textContent='Save failed'}},500);clearTimeout(pt);pt=setTimeout(preview,300)}
function tab(l){if(P)P[cur]=ta.value;cur=l;ta.value=P[l];$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));if(!hist[l].s.length)snap();ta.scrollTop=ta.scrollLeft=0;render()}
ta.addEventListener('input',()=>{render();changed();clearTimeout(ht);ht=setTimeout(snap,400)});
ta.addEventListener('scroll',sync);
const PR={'(':')','[':']','{':'}'};
ta.addEventListener('keydown',e=>{
 const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd,k=e.key,mod=e.ctrlKey||e.metaKey;
 if(mod&&k.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey?1:-1);return}
 if(mod&&k.toLowerCase()==='y'){e.preventDefault();undo(1);return}
 if(k==='Tab'){e.preventDefault();if(s===en&&!e.shiftKey){setV(v.slice(0,s)+T+v.slice(en),s+2,s+2);return}
  const ls=v.lastIndexOf('\n',s-1)+1,o=v.slice(ls,en).split('\n').map(l=>e.shiftKey?l.replace(/^ {1,2}/,''):T+l).join('\n');setV(v.slice(0,ls)+o+v.slice(en),ls,ls+o.length);return}
 if(k==='Enter'&&!mod){e.preventDefault();const ls=v.lastIndexOf('\n',s-1)+1,ind=v.slice(ls,s).match(/^\s*/)[0],pc=v[s-1],nc=v[en];
  const op='{[('.includes(pc||'~'),splitIt=(op&&nc===PR[pc])||(cur==='html'&&pc==='>'&&nc==='<'&&v[en+1]==='/');
  if(splitIt){const a='\n'+ind+T;setV(v.slice(0,s)+a+'\n'+ind+v.slice(en),s+a.length,s+a.length)}
  else{const a='\n'+ind+(op?T:'');setV(v.slice(0,s)+a+v.slice(en),s+a.length,s+a.length)}return}
 if(k.length===1&&PR[k]&&s===en){e.preventDefault();setV(v.slice(0,s)+k+PR[k]+v.slice(en),s+1,s+1);return}
 if(k.length===1&&')]}'.includes(k)&&s===en&&v[s]===k){e.preventDefault();ta.setSelectionRange(s+1,s+1)}
});
/* ---------- Formatter ---------- */
function fmtB(t,css){if(css)t=t.replace(/\{/g,'{\n').replace(/;(?![^(]*\))/g,';\n').replace(/\}/g,'\n}\n');let d=0;
 return t.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter((l,i,a)=>l||(i&&a[i-1])).map(l=>{if(!l)return l;const ld=(l.match(/^[}\])]+/)||[''])[0].length,o=(l.match(/[{[(]/g)||[]).length,c=(l.match(/[}\])]/g)||[]).length,ind=Math.max(d-ld,0);d+=o-c;return T.repeat(ind)+l}).join('\n').trim()}
function fmtH(t){const V=/^<(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr|!)/i;let d=0,raw='';const out=[];
 t.replace(/\r/g,'').split(/(<[^>]+>)/).forEach(s=>{if(!s.trim())return;s=s.trim();
  if(!/^<.*>$/.test(s)){const body=raw?fmtB(s,raw==='style'):s.replace(/\s+/g,' ');body.split('\n').forEach(l=>out.push(T.repeat(d)+l));return}
  const m=s.match(/^<(\/?)([\w-]+)/);if(m&&m[1]){d=Math.max(d-1,0);raw=''}out.push(T.repeat(d)+s);
  if(m&&!m[1]&&!V.test(s)&&!/\/>$/.test(s)){d++;if(/^(script|style)$/i.test(m[2]))raw=m[2].toLowerCase()}});
 return out.join('\n')}
$('#bFm').onclick=()=>{const v=ta.value,o=cur==='html'?fmtH(v):fmtB(v,cur==='css');setV(o,0,0)};
/* ---------- Find / replace ---------- */
const rx=()=>new RegExp(q.value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),cs?'g':'gi');
function marks(){if(fb.hidden||!q.value){mk.innerHTML='';$('#cnt').textContent='';return}
 const re=rx(),v=ta.value;let o='',l=0,m,n=0;while((m=re.exec(v))){if(!m[0]){re.lastIndex++;continue}
  o+=E(v.slice(l,m.index))+'<mark'+(m.index===ta.selectionStart&&ta.selectionEnd>m.index?' class="c"':'')+'>'+E(m[0])+'</mark>';l=re.lastIndex;n++}
 mk.innerHTML=o+E(v.slice(l))+'\n ';$('#cnt').textContent=n+' found'}
function fnd(d){const v=ta.value;if(!q.value)return;const ms=[...v.matchAll(rx())].filter(x=>x[0]);if(!ms.length){marks();return}
 const m=d>0?(ms.find(x=>x.index>=ta.selectionEnd)||ms[0]):([...ms].reverse().find(x=>x.index+x[0].length<=ta.selectionStart)||ms[ms.length-1]);
 ta.setSelectionRange(m.index,m.index+m[0].length);const lh=parseFloat(getComputedStyle(ta).lineHeight),y=v.slice(0,m.index).split('\n').length*lh;
 if(y<ta.scrollTop+30||y>ta.scrollTop+ta.clientHeight-60)ta.scrollTop=Math.max(0,y-ta.clientHeight/2);marks();sync()}
function openFind(){fb.hidden=false;const s=ta.value.slice(ta.selectionStart,ta.selectionEnd);if(s&&!s.includes('\n'))q.value=s;q.focus();q.select();marks()}
$('#bS').onclick=()=>fb.hidden?openFind():(fb.hidden=true,marks());
q.oninput=()=>{marks();fnd(1)};q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fnd(e.shiftKey?-1:1)}};
$('#fn').onclick=()=>fnd(1);$('#fp').onclick=()=>fnd(-1);
$('#fc').onclick=e=>{cs=!cs;e.target.classList.toggle('on',cs);marks()};
$('#f1').onclick=()=>{const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd,sel=v.slice(s,en);
 if(sel&&(cs?sel===q.value:sel.toLowerCase()===q.value.toLowerCase())){const r=$('#r').value;setV(v.slice(0,s)+r+v.slice(en),s+r.length,s+r.length)}fnd(1)};
$('#fa').onclick=()=>{if(!q.value)return;const r=$('#r').value;setV(ta.value.replace(rx(),()=>r),0,0)};
/* ---------- Preview ---------- */
function build(p,sep){const css=sep?'<link rel="stylesheet" href="style.css">':`<style>\n${p.css}\n</style>`,js=sep?'<script src="script.js"><\/script>':`<script>\n${p.js}\n<\/script>`;let h=p.html;
 h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,m=>css+'\n'+m):css+'\n'+h;h=/<\/body>/i.test(h)?h.replace(/<\/body>/i,m=>js+'\n'+m):h+'\n'+js;

function preview(){P[cur]=ta.value;pf.srcdoc=build(P)}
$$('[data-w]').forEach(b=>b.onclick=()=>{$$('[data-w]').forEach(x=>x.classList.toggle('on',x===b));pf.style.setProperty('--w',b.dataset.w);$('#pw').classList.toggle('dv',b.dataset.w!=='100%')});
$('#bRf').onclick=preview;
$('#bFs').onclick=()=>{const f=$('#pv').classList.toggle('full');$('#bFs').textContent=f?'Exit full screen':'Full screen'};
$$('.mt button').forEach(b=>b.onclick=()=>{document.body.dataset.v=b.dataset.v;$$('.mt button').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.v!=='ed')preview()});
if(innerWidth<=800&&innerWidth>innerHeight){document.body.dataset.v='sp';$$('.mt button').forEach(x=>x.classList.toggle('on',x.dataset.v==='sp'))}
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.l));
$('#bU').onclick=()=>{undo(-1);ta.focus()};$('#bR').onclick=()=>{undo(1);ta.focus()};
function zen(on){document.body.classList.toggle('zen',on)}
$('#bZ').onclick=()=>zen(true);$('#zx').onclick=()=>zen(false);
/* ---------- Export / ZIP ---------- */
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=-1;for(const x of b)c=CT[(c^x)&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const en=new TextEncoder(),parts=[],cd=[];let off=0,cs=0;
 for(const[n,d]of files){const nb=en.encode(n),db_=en.encode(d),c=crc(db_);
  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,0x21,true);l.setUint32(14,c,true);l.setUint32(18,db_.length,true);l.setUint32(22,db_.length,true);l.setUint16(26,nb.length,true);parts.push(l,nb,db_);
  const h=new DataView(new ArrayBuffer(46));h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(8,0x0800,true);h.setUint16(14,0x21,true);h.setUint32(16,c,true);h.setUint32(20,db_.length,true);h.setUint32(24,db_.length,true);h.setUint16(28,nb.length,true);h.setUint32(42,off,true);cd.push(h,nb);cs+=46+nb.length;off+=30+nb.length+db_.length}
